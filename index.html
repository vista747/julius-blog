<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>julius.cool</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1><span class="header-link" onclick="window.location='https://julius.cool'">julius.cool</span></h1>

  <!-- Add a new <li> for each post -->
  <div>
    <span class="post-link" onclick="window.location='posts/08-21-2025.html'">repurposing this blog</span> <small>— august 21, 2025 — 03:49</small>
  </div>
  <div>
    <span class="post-link" onclick="window.location='posts/08-20-2025-2.html'">how/why did i make this blog?</span> <small>— august 20, 2025 — 22:29</small>
  </div>
  <div>
    <span class="post-link" onclick="window.location='posts/08-20-2025.html'">my first blog post</span> <small>— august 20, 2025 — 19:43</small>
  </div>
  <script>
  // inject footer from root
  fetch("./footer.html")
    .then(r => r.text())
    .then(html => {
      const mount = document.getElementById("footer");
      mount.innerHTML = html;

      // theme helpers
      function applyTheme(theme) {
        if (theme === "dark") {
          document.body.classList.add("dark-mode");
          localStorage.setItem("theme", "dark");
          document.getElementById("theme-toggle").textContent = "light";
        } else {
          document.body.classList.remove("dark-mode");
          localStorage.setItem("theme", "light");
          document.getElementById("theme-toggle").textContent = "dark";
        }
      }

      // apply saved theme & wire up toggle
      applyTheme(localStorage.getItem("theme") || "light");
      document.getElementById("theme-toggle").addEventListener("click", () => {
        const next = document.body.classList.contains("dark-mode") ? "light" : "dark";
        applyTheme(next);
      });
    });
</script>
<div id="footer"></div>
</body>
</html>
