<!DOCTYPE html>
<html lang="en">
<header>
  <h1>julius's blog</h1>
  <div class="contact">
    <a href="#" id="contact-toggle" onclick="toggleContact(event)">contact →</a>
    <div id="contact-dropdown" class="contact-dropdown">
      <p>julius@julius.cool</p>
    </div>
  </div>
</header>
<body>
  <h1>julius's blog</h1>

  <!-- Add a new <li> for each post -->
  <ul>
    <li><a href="posts/myfirstpost.html">my first post</a> <small>— August 20, 2025 | 19:43</small></li>
  </ul>
  <script>
  function toggleContact(e) {
    e.preventDefault(); // stop page from jumping
    const toggle = document.getElementById("contact-toggle");
    const dropdown = document.getElementById("contact-dropdown");

    if (dropdown.style.display === "block") {
      dropdown.style.display = "none";
      toggle.textContent = "Contact →";
    } else {
      dropdown.style.display = "block";
      toggle.textContent = "Contact ↓";
    }
  }
</script>
</body>
</html>
