<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/head.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>my first blog post — julius.cool</title>
  <script>
  (function () {
    try {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark-mode');
      }
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="../style.css">
</head>
<body>
  <h1><span class="header-link" onclick="window.location='https://julius.cool'">my first blog post</span></h1>
  <p>
    <small>
      wednesday, august 20, 2025 — 19:43<br>
      track: vegyn - i've been going insane [129 bpm] — <span id="mute-toggle" class="mute-link">mute</span>
    </small>
  </p>

  <p>this is my first ever post. i'll probably do basic reviews of albums and stuff, hopefully i'll post every day. who knows. bye for now
  </p>

  <p><span class="post-link" onclick="window.location='https://julius.cool'">← back</span></p>

  <audio id="music" autoplay loop>
  <source src="audio/ive_been_going_insane.flac" type="audio/flac">
  </audio>
  
  <script>
  const audio = document.getElementById("music");
  audio.volume = 0.8; // default volume

  // Try autoplay immediately
  audio.play().catch(() => {
    // If it fails (autoplay blocked), wait for first click
    document.body.addEventListener("click", startAudio, { once: true });
  });

  function startAudio() {
    audio.play();
  }

  // Mute/unmute toggle
  const muteToggle = document.getElementById("mute-toggle");
  muteToggle.addEventListener("click", () => {
    if (audio.muted) {
      audio.muted = false;
      muteToggle.textContent = "mute";
    } else {
      audio.muted = true;
      muteToggle.textContent = "unmute";
    }
  });
  </script>

  <div id="footer"></div>
<script src="../footer.js"></script>
<script>
  loadFooter("../footer.html");
</script>
</body>
</html>
