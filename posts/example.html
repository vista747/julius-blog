<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>example post — julius.cool</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <h1><span class="header-link" onclick="window.location='https://julius.cool'">example post</span></h1>
  <p>
    <small>
      january 1, 2000 — 00:00<br>
      track: chino yoshio - 193193 sleep — <span id="mute-toggle" class="mute-link">mute</span>
    </small>
  </p>
  <p>
    example body text
  </p>

  <p><span class="post-link" onclick="window.location='https://julius.cool'">← back</span></p>

  <audio id="music" autoplay loop>
  <source src="audio/193193_sleep.flac" type="audio/flac">
  </audio>

  <script>
  const audio = document.getElementById("music");
  audio.volume = 0.8; // default volume

  // Try autoplay immediately
  audio.play().catch(() => {
    // If it fails (autoplay blocked), wait for first click
    document.body.addEventListener("click", startAudio, { once: true });
  });

  function startAudio() {
    audio.play();
  }

  // Mute/unmute toggle
  const muteToggle = document.getElementById("mute-toggle");
  muteToggle.addEventListener("click", () => {
    if (audio.muted) {
      audio.muted = false;
      muteToggle.textContent = "mute";
    } else {
      audio.muted = true;
      muteToggle.textContent = "unmute";
    }
  });
  </script>

  <script>
  // inject footer from posts/
  fetch("../footer.html")
    .then(r => r.text())
    .then(html => {
      const mount = document.getElementById("footer");
      mount.innerHTML = html;

      function applyTheme(theme) {
        if (theme === "dark") {
          document.body.classList.add("dark-mode");
          localStorage.setItem("theme", "dark");
          document.getElementById("theme-toggle").textContent = "light";
        } else {
          document.body.classList.remove("dark-mode");
          localStorage.setItem("theme", "light");
          document.getElementById("theme-toggle").textContent = "dark";
        }
      }

      applyTheme(localStorage.getItem("theme") || "light");
      document.getElementById("theme-toggle").addEventListener("click", () => {
        const next = document.body.classList.contains("dark-mode") ? "light" : "dark";
        applyTheme(next);
      });
    });
</script>
<div id="footer"></div>
</body>
</html>
