  <title>if you got a bumper then twerk it</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -webkit-touch-callout: none;
    }
    body.playing {
      cursor: none;
      pointer-events: none;
    }
    video {
      width: 100vw;
      height: auto;
      max-height: 100vh;
      object-fit: cover;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>
  <video id="tefVideo" loop playsinline preload="auto">
    <source src="assets/teftrack.mp4" type="video/mp4">
  </video>

  <script>
    const body = document.body;
    const video = document.getElementById('tefVideo');

    function startVideo() {
      if (video.readyState >= 2) {
        video.muted = false;
        video.play();
        body.classList.add('playing');
      } else {
        video.addEventListener('loadeddata', () => {
          video.muted = false;
          video.play();
          body.classList.add('playing');
        }, { once: true });
      }
    }

    document.addEventListener('click', startVideo, { once: true });
    document.addEventListener('touchstart', startVideo, { once: true });
  </script>
</body>
